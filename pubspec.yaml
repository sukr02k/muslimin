name: muslimin
description: "Aplikasi Muslimin — prayer times, tracker, Quran, dan qibla (full offline)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  adhan: ^2.0.0+1
  drift: 2.30.1
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.3.2
  geocoding: ^4.0.0
  geolocator: ^14.1.2
  path: ^1.9.1
  path_provider: ^2.1.6
  scrollable_positioned_list: ^0.3.8
  sqlite3_flutter_libs: 0.5.42
  timezone: ^0.11.2
  vibration: ^3.1.5

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: 2.30.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/quran/surah_list.json
    - assets/quran/surah/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700